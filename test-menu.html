<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wht D Fork | Digital Menu (Test Preview)</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-BHCMWL56VN"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-BHCMWL56VN');
    </script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/moments.css">
    <script src="site-config.js" defer></script>
</head>
<body>

    <!-- Top Navigation -->
    <nav class="top-bar">

        <a href="home.html" class="menu-brand" aria-label="Wht D Fork home">
            <img src="images/logo.png" alt="Wht D Fork logo">
            <span>
                <b class="brand-name">Wht D Fork</b>
                <small>Pure Veg Restaurant</small>
            </span>
        </a>

        <div class="menu-header-actions">
            <a href="home.html" class="visit-btn">Explore us <span>↗</span></a>
            <button class="menu-icon-btn"
                    onclick="toggleMenu()"
                    aria-label="Open Navigation">
                ☰
            </button>
        </div>

    </nav>

    <!-- Navigation Drawer -->
    <aside class="dropdown-drawer" id="dropdownDrawer">

        <div class="drawer-header">

            <span>Navigation</span>

            <button onclick="toggleMenu()" aria-label="Close Navigation">
                ✕
            </button>

        </div>

        <a href="home.html" class="drawer-item">
            🏠 Home
        </a>

        <a href="home.html#about" class="drawer-item">
            ❤️ About Us
        </a>

        <a href="home.html#gallery" class="drawer-item">
            📷 Gallery
        </a>

        <a href="home.html#favourites" class="drawer-item">
            ⭐ Favourites
        </a>

        <a href="home.html#visit" class="drawer-item">
            📍 Find Us
        </a>

        <a href="home.html#visit" class="drawer-item">
            ☎ Contact & Hours
        </a>

        <a id="menuWhatsapp" class="drawer-item" target="_blank" rel="noopener">
            💬 WhatsApp Us
        </a>

        <a id="menuInstagram" class="drawer-item" target="_blank" rel="noopener">
            📷 Instagram
        </a>

        <a id="menuFacebook" class="drawer-item" target="_blank" rel="noopener">
            👍 Facebook
        </a>

        <a id="menuYoutube" class="drawer-item" target="_blank" rel="noopener">
            ▶ YouTube
        </a>

        <a id="menuMap" class="drawer-item" target="_blank" rel="noopener">
            📍 Get Directions
        </a>

    </aside>

    <!-- Page Header -->
    <header class="header">

        <div class="header-content">

            <p class="hero-tagline">
                Happiness in Every Bite
            </p>

            <p class="hero-description">
                Scan • Browse • Enjoy
            </p>

        </div>

    </header>

    <!-- Dynamic Digital Menu Container -->
    <main class="menu-container" id="dynamicMenuContainer">
        <!-- Live Firebase images load dynamically here -->
        <div id="menuLoading" style="text-align: center; padding: 40px; color: #666;">
            <p>Loading digital menu...</p>
        </div>
    </main>

    <script>

        const drawer = document.getElementById("dropdownDrawer");

        function toggleMenu() {
            drawer.classList.toggle("active");
        }

        document.addEventListener("click", function(event) {

            const clickedMenuButton = event.target.closest(".menu-icon-btn");

            if (clickedMenuButton) {
                return;
            }

            if (!drawer.contains(event.target)) {
                drawer.classList.remove("active");
            }

        });

        window.addEventListener("keydown", function(event) {

            if (event.key === "Escape") {
                drawer.classList.remove("active");
            }

        });

        window.addEventListener("DOMContentLoaded", function() {
            const config = window.SITE_CONFIG;
            if (!config) return;
            const socialIcons = {
                Instagram: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.4" cy="6.6" r="1"></circle></svg>',
                Facebook: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 8h3V4h-3c-3.1 0-5 1.9-5 5v3H6v4h3v5h4v-5h3l1-4h-4V9c0-.7.3-1 1-1Z"></path></svg>',
                YouTube: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.2 7.2a2.7 2.7 0 0 0-1.9-1.9C17.7 5 12 5 12 5s-5.7 0-7.3.3A2.7 2.7 0 0 0 2.8 7.2 28 28 0 0 0 2.5 12c0 1.6.1 3.2.3 4.8a2.7 2.7 0 0 0 1.9 1.9C6.3 19 12 19 12 19s5.7 0 7.3-.3a2.7 2.7 0 0 0 1.9-1.9c.2-1.6.3-3.2.3-4.8 0-1.6-.1-3.2-.3-4.8ZM10 15.5v-7l6 3.5-6 3.5Z"></path></svg>'
            };
            document.title = `${config.name} | Digital Menu`;
            document.querySelector(".brand-name").textContent = config.name;
            document.getElementById("menuWhatsapp").href = `https://wa.me/${config.whatsappNumber}`;
            document.getElementById("menuInstagram").href = config.socials.Instagram;
            document.getElementById("menuFacebook").href = config.socials.Facebook;
            document.getElementById("menuYoutube").href = config.socials.YouTube;
            document.getElementById("menuMap").href = config.mapUrl;
            document.getElementById("menuInstagram").innerHTML = `${socialIcons.Instagram}<span>Instagram</span>`;
            document.getElementById("menuFacebook").innerHTML = `${socialIcons.Facebook}<span>Facebook</span>`;
            document.getElementById("menuYoutube").innerHTML = `${socialIcons.YouTube}<span>YouTube</span>`;
        });

    </script>

    <!-- Dynamic Firebase Real-time Menu Loader -->
    <script type="module" src="js/menu-loader.js"></script>
    <script type="module" src="js/moments.js"></script>

</body>
</html>
