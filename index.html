<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wht D Fork | Digital Menu</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-BHCMWL56VN"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-BHCMWL56VN');
    </script>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/site-config.js" defer></script>
</head>
<body>

    <!-- Shared header (nav + drawer) -->
    <div id="site-header"></div>

    <!-- Digital Menu -->
    <main class="menu-container">

        <img id="img-cover"
             class="menu-image"
             src="images/menu/1_cover.JPG"
             alt="Wht D Fork Cover">

        <img id="img-pizza"
             class="menu-image"
             src="images/menu/2_pizza_menu.JPG"
             alt="Pizza Menu">

        <img id="img-momos"
             class="menu-image"
             src="images/menu/3_momos.JPG"
             alt="Momos">

        <img id="img-drinks"
             class="menu-image"
             src="images/menu/4_drinks.JPG"
             alt="Drinks and other items">

        <img id="img-desserts"
             class="menu-image"
             src="images/menu/5_desserts.JPG"
             alt="Desserts">

        <img id="img-garlicbread"
             class="menu-image"
             src="images/menu/6_garlic_bread.JPG"
             alt="Garlic Bread">

        <img id="img-thankyou"
             class="menu-image"
             src="images/menu/7_thank_you.JPG"
             alt="Thank You">

    </main>

    <script>

        const drawer = document.getElementById("dropdownDrawer");

        function toggleMenu() {
            drawer.classList.toggle("active");
        }

        document.addEventListener("click", function(event) {

            const clickedMenuButton = event.target.closest(".menu-icon-btn");

            if (clickedMenuButton) {
                return;
            }

            if (!drawer.contains(event.target)) {
                drawer.classList.remove("active");
            }

        });

        window.addEventListener("keydown", function(event) {

            if (event.key === "Escape") {
                drawer.classList.remove("active");
            }

        });

        window.addEventListener("DOMContentLoaded", function() {
            const config = window.SITE_CONFIG;
            if (!config) return;
            const socialIcons = {
                Instagram: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.4" cy="6.6" r="1"></circle></svg>',
                Facebook: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 8h3V4h-3c-3.1 0-5 1.9-5 5v3H6v4h3v5h4v-5h3l1-4h-4V9c0-.7.3-1 1-1Z"></path></svg>',
                YouTube: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.2 7.2a2.7 2.7 0 0 0-1.9-1.9C17.7 5 12 5 12 5s-5.7 0-7.3.3A2.7 2.7 0 0 0 2.8 7.2 28 28 0 0 0 2.5 12c0 1.6.1 3.2.3 4.8a2.7 2.7 0 0 0 1.9 1.9C6.3 19 12 19 12 19s5.7 0 7.3-.3a2.7 2.7 0 0 0 1.9-1.9c.2-1.6.3-3.2.3-4.8 0-1.6-.1-3.2-.3-4.8ZM10 15.5v-7l6 3.5-6 3.5Z"></path></svg>'
            };
            document.title = `${config.name} | Digital Menu`;
            document.querySelector(".brand-name").textContent = config.name;
            document.getElementById("menuWhatsapp").href = `https://wa.me/${config.whatsappNumber}`;
            document.getElementById("menuInstagram").href = config.socials.Instagram;
            document.getElementById("menuFacebook").href = config.socials.Facebook;
            document.getElementById("menuYoutube").href = config.socials.YouTube;
            document.getElementById("menuMap").href = config.mapUrl;
            document.getElementById("menuInstagram").innerHTML = `${socialIcons.Instagram}<span>Instagram</span>`;
            document.getElementById("menuFacebook").innerHTML = `${socialIcons.Facebook}<span>Facebook</span>`;
            document.getElementById("menuYoutube").innerHTML = `${socialIcons.YouTube}<span>YouTube</span>`;
        });

    </script>

    <!-- Shared footer -->
    <div id="site-footer"></div>

    <!-- Client-side partial injector -->
    <script src="js/includes.js" defer></script>

    <!-- Firebase Live Menu Loader Script -->
    <script type="module" src="js/menu-loader.js"></script>

</body>
</html>
