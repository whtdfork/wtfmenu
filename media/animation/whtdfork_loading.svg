<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="150" height="150">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .bg-circle { fill: #6b0c1e; }
    .ring-outer { fill: none; stroke: #f1c40f; stroke-width: 4; }
    .ring-inner { fill: none; stroke: #f1c40f; stroke-width: 6; }
    .brand-wht { font-family: 'Brush Script MT', cursive, sans-serif; font-weight: bold; font-size: 52px; fill: #ffffff; filter: url(#shadow); }
    .brand-d { font-family: 'Brush Script MT', cursive, sans-serif; font-weight: bold; font-size: 52px; fill: #f1c40f; filter: url(#shadow); }
    .brand-fork { font-family: 'Brush Script MT', cursive, sans-serif; font-weight: bold; font-size: 52px; fill: #ffffff; filter: url(#shadow); }
    .clock-hand { transform-origin: 250px 250px; animation: rotateClockHand 1s linear infinite; }
    @keyframes rotateClockHand { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>

  <circle cx="250" cy="250" r="235" class="bg-circle" />
  <circle cx="250" cy="250" r="220" class="ring-outer" />
  <circle cx="250" cy="250" r="204" class="ring-inner" />

  <text x="125" y="225" class="brand-wht" transform="rotate(-10, 125, 225)">Wht</text>
  <text x="135" y="300" class="brand-d">d</text>
  <text x="245" y="305" class="brand-fork" transform="rotate(8, 245, 305)">Fork</text>

  <g transform="translate(250, 90) scale(1.35)">
    <circle cx="0" cy="0" r="25" fill="#f39c12" stroke="#2c3e50" stroke-width="2.5" filter="url(#shadow)"/>
    <path d="M 0 0 L -18 15 A 25 25 0 0 0 18 15 Z" fill="#e74c3c"/>
    <circle cx="-5" cy="8" r="3" fill="#c0392b"/>
    <circle cx="5" cy="10" r="3" fill="#c0392b"/>
  </g>

  <g transform="translate(400, 250) scale(1.35)">
    <path d="M -18 -8 L 18 -8 C 18 12 -18 12 -18 -8 Z" fill="#fdfefe" stroke="#2c3e50" stroke-width="2.5" filter="url(#shadow)"/>
    <path d="M 18 -4 C 25 -4 25 6 18 6" fill="none" stroke="#2c3e50" stroke-width="2.5"/>
    <rect x="-20" y="-12" width="40" height="4" fill="#d35400" rx="2" />
    <path d="M -6 -20 Q -3 -26 0 -20" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path d="M 4 -20 Q 7 -26 10 -20" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  </g>

  <g transform="translate(250, 410) scale(1.35)">
    <ellipse cx="0" cy="12" rx="28" ry="6" fill="#bdc3c7" stroke="#2c3e50" stroke-width="2"/>
    <path d="M -16 12 C -18 2 -5 -2 0 4 C 5 -2 18 2 16 12 Z" fill="#fdfefe" stroke="#2c3e50" stroke-width="2.5" filter="url(#shadow)"/>
    <path d="M -8 12 C -10 4 -2 0 2 6" fill="none" stroke="#bdc3c7" stroke-width="1.5"/>
    <path d="M -6 -8 Q -3 -14 0 -8" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path d="M 4 -8 Q 7 -14 10 -8" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  </g>

  <g transform="translate(95, 250) scale(1.35)">
    <ellipse cx="0" cy="-10" rx="22" ry="10" fill="#f39c12" stroke="#2c3e50" stroke-width="2.5" filter="url(#shadow)"/>
    <rect x="-20" y="-5" width="40" height="6" fill="#27ae60" rx="2" stroke="#2c3e50" stroke-width="1.5"/>
    <rect x="-22" y="1" width="44" height="8" fill="#d35400" rx="3" stroke="#2c3e50" stroke-width="2"/>
    <ellipse cx="0" cy="9" rx="22" ry="9" fill="#f39c12" stroke="#2c3e50" stroke-width="2.5"/>
    <path d="M -6 -24 Q -3 -30 0 -24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path d="M 4 -24 Q 7 -30 10 -24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  </g>

  <g class="clock-hand">
    <circle cx="250" cy="250" r="10" fill="#f1c40f" stroke="#2c3e50" stroke-width="3" filter="url(#shadow)" />
    <rect x="245" y="140" width="10" height="110" fill="#f1c40f" stroke="#2c3e50" stroke-width="2" rx="3" filter="url(#shadow)" />
    <path d="M 238 95 L 238 140 L 262 140 L 262 95" fill="#f1c40f" stroke="#2c3e50" stroke-width="2" filter="url(#shadow)" />
    <line x1="246" y1="95" x2="246" y2="128" stroke="#6b0c1e" stroke-width="2.5" stroke-linecap="round" />
    <line x1="254" y1="95" x2="254" y2="128" stroke="#6b0c1e" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
